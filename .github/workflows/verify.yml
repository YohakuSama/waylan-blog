name: Waylan CI

# One entry point; no duplicate npm ci, builds or browser installations.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: What to run
        required: true
        type: choice
        default: full
        options:
          - full
          - branches-preview
          - branches-prune
      confirmation:
        description: "For branches-prune only: DELETE_VERIFIED_MERGED_BRANCHES"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: waylan-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (include base history for changed-path detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks by changed surface
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
        run: node scripts/ci-plan.mjs
      - name: Validate CI policy and safe branch handling
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: node --test scripts/maintenance.test.mjs
      - name: Node 24 with shared npm cache
        if: ${{ steps.plan.outputs.code == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies once
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: npm ci
      - name: Typecheck, build, unit and static integrity tests
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: npm run check

      # One browser install and build for all applicable frontend regressions.
      - name: Install browser QA once
        id: browsers
        if: ${{ success() && steps.plan.outputs.browser == 'true' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Phone, tablet and desktop layout
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/visual-smoke.mjs
      - name: Chromium Firefox WebKit and admin interactions
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/quality-smoke.mjs
      - name: WCAG accessibility checks
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/a11y-smoke.mjs

      # Targeted functional groups, not five independent workflows/runners.
      - name: Reader navigation, TOC and settings
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/reader-deep-smoke.mjs
      - name: iOS excerpt and composer touch behavior
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/selection-composer-smoke.mjs
      - name: Android iPhone iPad and desktop navigation parity
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/responsive-navigation-smoke.mjs
      - name: Rapid-navigation ghosting regression
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/route-motion-ghost-smoke.mjs
      - name: Excerpt and floating control audit
        if: ${{ !cancelled() && steps.plan.outputs.feed == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/excerpt-audit.mjs
      - name: Search, sort and state-machine regression
        if: ${{ !cancelled() && steps.plan.outputs.feed == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/interaction-state-smoke.mjs
      - name: Preview motion across three engines
        if: ${{ !cancelled() && steps.plan.outputs.motion == 'true' && steps.browsers.outcome == 'success' }}
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4180 --strictPort > /tmp/waylan-motion-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..70}; do
            if curl -fsS http://127.0.0.1:4180/feed/ >/dev/null; then break; fi
            sleep 1
          done
          WAYLAN_AUDIT_ORIGIN=http://127.0.0.1:4180 \
            WAYLAN_AUDIT_OUTPUT=preview-motion-report \
            node scripts/live-sort-motion-audit.mjs
      - name: Read-only production motion comparison (manual full only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.suite == 'full' && steps.browsers.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/live-sort-motion-audit.mjs
        env:
          WAYLAN_AUDIT_ORIGIN: https://waylan.org
          WAYLAN_AUDIT_OUTPUT: live-motion-report

      # Screenshots/storage are useful for failures or requested audits, not every PR.
      - name: Upload QA evidence if failed or explicitly requested
        if: ${{ !cancelled() && (failure() || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) }}
        uses: actions/upload-artifact@v4
        with:
          name: waylan-qa-evidence
          path: |
            visual-report/
            quality-report/
            accessibility-report/
            responsive-navigation-report/
            reader-audit-report/
            route-motion-ghost-report/
            excerpt-audit-report/
            interaction-report/
            preview-motion-report/
            live-motion-report/
          if-no-files-found: ignore
          retention-days: 3


  branches:
    # One-time, owner-authorized GC of the verified 2026-11-06 archive;
    # otherwise only an owner dispatch on trusted main may prune.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && (inputs.suite == 'branches-preview' || inputs.suite == 'branches-prune')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[branch-gc-20261106]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout archived cleanup plan from trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review or prune only merged, SHA-matched branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE_CONFIRM: ${{ github.event_name == 'push' && 'DELETE_VERIFIED_MERGED_BRANCHES' || inputs.confirmation }}
          MODE: ${{ github.event_name == 'push' && 'branches-prune' || inputs.suite }}
          GC_ONCE: ${{ github.event_name == 'push' && 'branch-gc-20261106' || '' }}
        run: |
          if [ "$MODE" = "branches-prune" ]; then
            node scripts/branch-maintenance.mjs prune
          else
            node scripts/branch-maintenance.mjs preview
          fi
