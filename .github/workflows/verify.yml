name: Waylan CI

# One entry point; no duplicate npm ci, builds or browser installations.
on:
  # Drafts are development workspaces: create a skipped check without
  # provisioning a runner. The ready_for_review transition runs the full gate
  # against the exact current PR head; later commits to a ready PR re-run it.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: waylan-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Avoid allocating CI minutes while a PR is still being actively drafted.
    # GitHub prevents merging drafts; ready_for_review always triggers this
    # same required job, including full scoped browser tests for UI changes.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (include base history for changed-path detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks by changed surface
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-plan.mjs
      - name: Validate CI scope policy
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: node --test scripts/maintenance.test.mjs
      - name: Node 24 with shared npm cache
        if: ${{ steps.plan.outputs.code == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies once
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: npm ci
      - name: Typecheck, build, unit and static integrity tests
        if: ${{ steps.plan.outputs.code == 'true' }}
        run: npm run check

      # One browser setup for all relevant checks. Separate bounded stages
      # pinpoint package, Linux library and browser download problems.
      - name: Install Playwright QA packages (bounded)
        id: browser-packages
        if: ${{ success() && steps.plan.outputs.browser == 'true' }}
        timeout-minutes: 4
        env:
          npm_config_fetch_retries: 1
          npm_config_fetch_timeout: 120000
        run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.14.0
      - name: Restore version-pinned browser binaries
        id: browser-cache
        if: ${{ success() && steps.plan.outputs.browser == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.56.1-v1
      - name: Install Linux browser libraries (bounded)
        if: ${{ success() && steps.plan.outputs.browser == 'true' }}
        timeout-minutes: 4
        run: npx playwright install-deps chromium firefox webkit
      - name: Verify Playwright browser binaries (bounded)
        id: browsers
        if: ${{ success() && steps.plan.outputs.browser == 'true' }}
        timeout-minutes: 5
        run: |
          # On an exact cache hit this is a fast presence check, not a download.
          # On a miss it installs all three browsers before any tests begin.
          npx playwright install chromium firefox webkit
          node --input-type=module -e '
            import { existsSync } from "node:fs";
            import { chromium, firefox, webkit } from "playwright";
            for (const [name, engine] of Object.entries({ chromium, firefox, webkit })) {
              if (!existsSync(engine.executablePath())) throw Error(name + " binary missing");
              console.log(name + ": ready");
            }
          '
          echo "Browser cache hit: ${{ steps.browser-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      # Save before the longer visual tests. A later assertion failure should
      # not throw away a successfully installed cache for the next PR commit.
      - name: Save browser binaries immediately on cache miss
        if: ${{ success() && steps.plan.outputs.browser == 'true' && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.56.1-v1
      - name: Phone, tablet and desktop layout
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          # PRs exercise key viewport thresholds; manual full runs retain all 16.
          WAYLAN_VISUAL_MATRIX: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'smoke' }}
        run: node scripts/visual-smoke.mjs
      - name: Chromium Firefox WebKit and admin interactions
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/quality-smoke.mjs
      - name: WCAG accessibility checks
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/a11y-smoke.mjs

      # Targeted functional groups, not five independent workflows/runners.
      - name: Reader navigation, TOC and settings
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/reader-deep-smoke.mjs
      - name: iOS excerpt and composer touch behavior
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/selection-composer-smoke.mjs
      - name: Android iPhone iPad and desktop navigation parity
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/responsive-navigation-smoke.mjs
      - name: Rapid-navigation ghosting regression
        if: ${{ !cancelled() && steps.plan.outputs.reader == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/route-motion-ghost-smoke.mjs
      - name: Excerpt and floating control audit
        if: ${{ !cancelled() && steps.plan.outputs.feed == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/excerpt-audit.mjs
      - name: Search, sort and state-machine regression
        if: ${{ !cancelled() && steps.plan.outputs.feed == 'true' && steps.browsers.outcome == 'success' }}
        run: node scripts/interaction-state-smoke.mjs
      - name: Preview motion across three engines
        if: ${{ !cancelled() && steps.plan.outputs.motion == 'true' && steps.browsers.outcome == 'success' }}
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4180 --strictPort > /tmp/waylan-motion-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..70}; do
            if curl -fsS http://127.0.0.1:4180/feed/ >/dev/null; then break; fi
            sleep 1
          done
          WAYLAN_AUDIT_ORIGIN=http://127.0.0.1:4180 \
            WAYLAN_AUDIT_OUTPUT=preview-motion-report \
            node scripts/live-sort-motion-audit.mjs
      - name: Read-only production motion comparison (manual full only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.browsers.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/live-sort-motion-audit.mjs
        env:
          WAYLAN_AUDIT_ORIGIN: https://waylan.org
          WAYLAN_AUDIT_OUTPUT: live-motion-report

      # Screenshots/storage are useful for failures or requested audits, not every PR.
      - name: Upload QA evidence if failed or explicitly requested
        if: ${{ !cancelled() && (failure() || (github.event_name == 'workflow_dispatch')) }}
        uses: actions/upload-artifact@v4
        with:
          name: waylan-qa-evidence
          path: |
            visual-report/
            quality-report/
            accessibility-report/
            responsive-navigation-report/
            reader-audit-report/
            route-motion-ghost-report/
            excerpt-audit-report/
            interaction-report/
            preview-motion-report/
            live-motion-report/
          if-no-files-found: ignore
          retention-days: 3


