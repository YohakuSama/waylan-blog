name: Verify blog layout and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, build and test
        run: npm run check
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check real desktop, tablet and phone viewports
        run: node scripts/visual-smoke.mjs
      - name: Upload viewport screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waylan-viewport-smoke
          path: visual-report/
          if-no-files-found: ignore
          retention-days: 7
