name: Read-only production sort and motion audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR updates supersede older PR builds. Never cancel main or manual audits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium Firefox and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Build exact PR preview
        run: npm run build
      - name: Test proposed fix with Chromium, Firefox and WebKit
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4180 --strictPort > /tmp/waylan-motion-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..70}; do
            if curl -fsS http://127.0.0.1:4180/feed/ >/dev/null; then break; fi
            sleep 1
          done
          WAYLAN_AUDIT_ORIGIN=http://127.0.0.1:4180 \
          WAYLAN_AUDIT_OUTPUT=preview-motion-report \
          node scripts/live-sort-motion-audit.mjs
      - name: Observe current production baseline (informational)
        if: always()
        continue-on-error: true
        run: node scripts/live-sort-motion-audit.mjs
        env:
          WAYLAN_AUDIT_ORIGIN: https://waylan.org
          WAYLAN_AUDIT_OUTPUT: live-motion-report
      - name: Upload preview and production observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-and-live-sort-motion-report
          path: |
            preview-motion-report/
            live-motion-report/
          if-no-files-found: ignore
          retention-days: 7
