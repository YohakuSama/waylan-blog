name: Read-only production sort and motion audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium Firefox and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Test public Waylan sorting, page transitions and random navigation
        run: node scripts/live-sort-motion-audit.mjs
        env:
          WAYLAN_AUDIT_ORIGIN: https://waylan.org
      - name: Upload production observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sort-motion-report
          path: live-motion-report/
          if-no-files-found: ignore
          retention-days: 7
