name: Reader deep interactions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test reader neighbors, back-to-list and settings transition
        run: node scripts/reader-deep-smoke.mjs
      - name: Save reader flow screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-deep-audit
          path: reader-audit-report/
          if-no-files-found: ignore
          retention-days: 7
