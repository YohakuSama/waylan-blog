name: Windows local build verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    # Manual-only: runs trusted main-branch code on the owner's personal laptop.
    # Do not enable pull_request or automatic triggers for a personal runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run typecheck, build, unit and static integrity tests
        run: npm run check
      - name: Install browser test library (use installed Edge or Chrome)
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Audit phone, tablet and desktop feed / article layout
        run: node scripts/mobile-layout-audit.mjs
      - name: Save layout screenshots and measured geometry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: waylan-mobile-layout-audit
          path: mobile-layout-report/
          if-no-files-found: ignore
          retention-days: 7
