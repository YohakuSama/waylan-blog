name: Windows local build verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    # Manual-only: runs trusted main-branch code on the owner's personal laptop.
    # Do not enable pull_request or automatic triggers for a personal runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run typecheck, build, unit and static integrity tests
        run: npm run check
