name: Import Waylan source
on:
  push:
    paths:
      - ".github/import-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'YohakuSama/waylan-blog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract private source archive and commit
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .import/waylan-source.tar.gz.b64 > /tmp/waylan-source.tar.gz
          test "$(tar -tzf /tmp/waylan-source.tar.gz | wc -l)" -eq 130
          tar -xzf /tmp/waylan-source.tar.gz -C .
          rm -rf .import
          rm -f .github/import-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Waylan v2.3 private blog source"
          git push origin HEAD:main
